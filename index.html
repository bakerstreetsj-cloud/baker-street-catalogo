  <title>Catálogo · Baker Street</title>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {

      --texto: #f0ead6;
      --texto-suave: rgba(240, 234, 214, 0.55);
      --texto-tenue: rgba(240, 234, 214, 0.3);
    }

      font-family: 'DM Sans', sans-serif;
      background: var(--negro);
      color: var(--texto);
      min-height: 100vh;
    }

    header {
      background: var(--negro);
      border-bottom: 0.5px solid var(--borde);
      padding: 1.8rem 2rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .header-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

      font-family: 'Pirata One', serif;
      font-size: 30px;
      font-weight: 400;
      color: var(--amarillo);
      letter-spacing: 1px;
      line-height: 1;
    }
