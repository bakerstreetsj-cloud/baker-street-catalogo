
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo · Baker Street</title>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=EB+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --amarillo: #FCB300;
      --negro: #0d0d0d;
      --negro-card: #1a1a1a;
      --borde: rgba(252, 179, 0, 0.15);
      --borde-hover: rgba(252, 179, 0, 0.4);
      --texto: #f0ead6;
      --texto-suave: rgba(240, 234, 214, 0.55);
      --texto-tenue: rgba(240, 234, 214, 0.3);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--negro);
      color: var(--texto);
      min-height: 100vh;
    }

    header {
      background: var(--negro);
      border-bottom: 0.5px solid var(--borde);
      padding: 1.8rem 2rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .header-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-family: 'Pirata One', serif;
      font-size: 30px;
      font-weight: 400;
      color: var(--amarillo);
      letter-spacing: 1px;
      line-height: 1;
    }

    .header-text p {
      font-size: 11px;
      color: var(--texto-suave);
      font-weight: 300;
      margin-top: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem 5rem;
    }

    .bs-search-wrap {
      position: relative;
      margin-bottom: 1.2rem;
    }

    .bs-search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--texto-suave);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    #bs-search {
      width: 100%;
      padding: 11px 16px 11px 40px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      border: 0.5px solid var(--borde);
      border-radius: 6px;
      background: var(--negro-card);
      color: var(--texto);
      outline: none;
      transition: border-color 0.2s;
    }

    #bs-search::placeholder { color: var(--texto-tenue); }
    #bs-search:focus { border-color: rgba(252, 179, 0, 0.5); }

    #bs-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 1.8rem;
    }

    .bs-chip {
      padding: 5px 14px;
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      border: 0.5px solid var(--borde);
      border-radius: 999px;
      background: transparent;
      color: var(--texto-suave);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .bs-chip:hover { border-color: var(--borde-hover); color: var(--texto); }

    .bs-chip.active {
      background: var(--amarillo);
      color: var(--negro);
      border-color: var(--amarillo);
      font-weight: 500;
    }

    #bs-count {
      font-size: 11px;
      color: var(--texto-tenue);
      margin-bottom: 1rem;
      font-weight: 300;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .bs-list { border-top: 0.5px solid var(--borde); }

    .bs-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      padding: 16px 0;
      border-bottom: 0.5px solid var(--borde);
      gap: 20px;
    }

    .bs-item-title {
      font-family: 'EB Garamond', serif;
      font-size: 17px;
      font-weight: 400;
      color: var(--texto);
      margin-bottom: 3px;
      line-height: 1.3;
    }

    .bs-item-author {
      font-size: 12px;
      color: var(--texto-suave);
      margin-bottom: 7px;
      font-weight: 300;
    }

    .bs-item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .bs-genre-tag {
      font-size: 9px;
      padding: 2px 9px;
      border-radius: 999px;
      border: 0.5px solid var(--borde);
      color: var(--texto-tenue);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .bs-editorial {
      font-size: 11px;
      color: var(--texto-tenue);
      font-weight: 300;
    }

    .bs-item-price {
      font-size: 15px;
      font-weight: 500;
      color: var(--amarillo);
      white-space: nowrap;
      padding-top: 3px;
    }

    .bs-empty, .bs-loading {
      padding: 4rem 0;
      text-align: center;
      font-size: 14px;
      color: var(--texto-tenue);
      font-weight: 300;
    }

    .bs-loading::after {
      content: '';
      display: block;
      width: 22px;
      height: 22px;
      border: 1.5px solid var(--borde);
      border-top-color: var(--amarillo);
      border-radius: 50%;
      margin: 1rem auto 0;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .bs-error {
      padding: 1.5rem;
      border: 0.5px solid var(--borde);
      border-radius: 6px;
      background: var(--negro-card);
      font-size: 13px;
      color: var(--texto-suave);
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 10px;
      color: var(--texto-tenue);
      font-weight: 300;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-top: 0.5px solid var(--borde);
    }

    footer a { color: var(--amarillo); text-decoration: none; }

    @media (max-width: 480px) {
      header { padding: 1.2rem 1rem; }
      main { padding: 1.5rem 1rem 4rem; }
      .header-text h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

<header>
  <svg class="header-icon" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <circle cx="40" cy="40" r="40" fill="#1a1a1a"/>
    <path d="M28 58 C24 54 22 47 23 41 C22 35 26 28 33 25 C35 19 41 17 47 18 C54 19 59 25 59 32 C63 35 64 42 61 48 C59 53 54 57 48 59 L46 63 C44 67 38 68 34 66 C31 63 29 61 28 58Z" fill="#FCB300"/>
    <ellipse cx="50" cy="46" rx="5" ry="7" fill="#1a1a1a"/>
    <path d="M33 29 C30 26 29 21 32 18 C35 15 40 16 42 20" fill="#FCB300"/>
    <path d="M54 50 Q60 54 62 50" stroke="#FCB300" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="header-text">
    <h1>Baker Street</h1>
    <p>Librería · San Juan</p>
  </div>
</header>

<main>
  <div class="bs-search-wrap">
    <svg class="bs-search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    <input type="text" id="bs-search" placeholder="Buscar por título o autor..." aria-label="Buscar libros" />
  </div>

  <div id="bs-filters" role="group" aria-label="Filtrar por género"></div>
  <p id="bs-count"></p>
  <div id="bs-list"><div class="bs-loading">Cargando catálogo</div></div>
</main>

<footer>Baker Street · <a href="https://www.instagram.com/bakerstreet.sj/">@bakerstreet.sj</a> · San Juan, Argentina</footer>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTciR-ezMp4lpUi2MFQC2IGWzz0vfdXXtSATjNn2WgS4CDIJzHpCuTAAszIHIIbvjSsOnEZ7bprL5kI/pub?gid=0&single=true&output=csv';

let allBooks = [];
let activeGenre = 'Todos';
let searchQuery = '';

function smartSplit(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

function normalize(str) {
  return str.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function toTitleCase(str) {
  if (!str) return '';
  const min = ['de','del','la','las','el','los','y','e','o','a','en','con','por','para','un','una','al'];
  return str.toLowerCase().split(' ').map((w, i) => {
    if (i > 0 && min.includes(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = smartSplit(lines[0]).map(h => normalize(h.replace(/^"|"$/g, '')));
  const books = [];
  for (let i = 1; i < lines.length; i++) {
    const row = smartSplit(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (row[idx] || '').trim().replace(/^"|"$/g, ''); });
    const qty = parseInt(obj['cantidad'] || 0);
    if (isNaN(qty) || qty < 1) continue;
    const titulo = obj['titulo'] || '';
    if (!titulo) continue;
    books.push({
      titulo: toTitleCase(titulo),
      autor: toTitleCase(obj['autor'] || ''),
      genero: (obj['genero'] || '').trim(),
      precio: obj['precio'] || '',
      editorial: toTitleCase((obj['editorial'] || '').trim()),
    });
  }
  return books;
}

function getGenres(books) {
  return ['Todos', ...[...new Set(books.map(b => b.genero).filter(Boolean))].sort()];
}

function renderFilters(genres) {
  const container = document.getElementById('bs-filters');
  container.innerHTML = '';
  genres.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'bs-chip' + (g === activeGenre ? ' active' : '');
    btn.textContent = g;
    btn.onclick = () => { activeGenre = g; renderFilters(genres); renderList(); };
    container.appendChild(btn);
  });
}

function renderList() {
  const q = searchQuery.toLowerCase();
  const filtered = allBooks.filter(b => {
    const matchGenre = activeGenre === 'Todos' || b.genero === activeGenre;
    const matchSearch = !q || b.titulo.toLowerCase().includes(q) || b.autor.toLowerCase().includes(q);
    return matchGenre && matchSearch;
  });

  document.getElementById('bs-count').textContent =
    filtered.length === 1 ? '1 libro disponible' : `${filtered.length} libros disponibles`;

  const container = document.getElementById('bs-list');

  if (filtered.length === 0) {
    container.innerHTML = '<div class="bs-empty">No hay libros que coincidan.</div>';
    return;
  }

  const list = document.createElement('div');
  list.className = 'bs-list';

  filtered.forEach(b => {
    const item = document.createElement('div');
    item.className = 'bs-item';

    const main = document.createElement('div');

    const title = document.createElement('p');
    title.className = 'bs-item-title';
    title.textContent = b.titulo;

    const author = document.createElement('p');
    author.className = 'bs-item-author';
    author.textContent = b.autor;

    const meta = document.createElement('div');
    meta.className = 'bs-item-meta';

    if (b.genero) {
      const tag = document.createElement('span');
      tag.className = 'bs-genre-tag';
      tag.textContent = b.genero;
      meta.appendChild(tag);
    }
    if (b.editorial) {
      const ed = document.createElement('span');
      ed.className = 'bs-editorial';
      ed.textContent = b.editorial;
      meta.appendChild(ed);
    }

    main.appendChild(title);
    main.appendChild(author);
    main.appendChild(meta);

    const price = document.createElement('div');
    price.className = 'bs-item-price';
    price.textContent = b.precio;

    item.appendChild(main);
    item.appendChild(price);
    list.appendChild(item);
  });

  container.innerHTML = '';
  container.appendChild(list);
}

async function loadBooks() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error();
    const text = await res.text();
    allBooks = parseCSV(text);
    if (allBooks.length === 0) {
      document.getElementById('bs-list').innerHTML = '<div class="bs-error">La planilla se cargó pero no hay libros con stock disponible.</div>';
      return;
    }
    renderFilters(getGenres(allBooks));
    renderList();
  } catch {
    document.getElementById('bs-list').innerHTML = '<div class="bs-error">No se pudo cargar el catálogo. Verificá que la planilla esté publicada como CSV.</div>';
  }
}

document.getElementById('bs-search').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderList();
});

loadBooks();
</script>
</body>
</html>
