<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo · Baker Street</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #faf9f7;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      border-bottom: 0.5px solid #e0ddd8;
      padding: 1.5rem 2rem;
      background: #faf9f7;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.3px;
    }

    header p {
      font-size: 12px;
      color: #888;
      font-weight: 300;
      margin-top: 2px;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    #bs-search {
      width: 100%;
      padding: 10px 16px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      border: 0.5px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    #bs-search:focus { border-color: #888; }

    #bs-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .bs-chip {
      padding: 5px 14px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      border: 0.5px solid #ccc;
      border-radius: 999px;
      background: #fff;
      color: #666;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .bs-chip:hover { border-color: #888; color: #1a1a1a; }

    .bs-chip.active {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    #bs-count {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 1rem;
      font-weight: 300;
    }

    .bs-list {
      border-top: 0.5px solid #e0ddd8;
    }

    .bs-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      padding: 14px 0;
      border-bottom: 0.5px solid #e0ddd8;
      gap: 16px;
    }

    .bs-item-title {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      font-weight: 400;
      margin-bottom: 3px;
      line-height: 1.3;
      color: #1a1a1a;
    }

    .bs-item-author {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
      font-weight: 300;
    }

    .bs-item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .bs-genre-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 0.5px solid #e0ddd8;
      color: #888;
      background: #f4f3f0;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .bs-editorial {
      font-size: 11px;
      color: #bbb;
      font-weight: 300;
    }

    .bs-item-price {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
      white-space: nowrap;
      padding-top: 2px;
    }

    .bs-empty, .bs-loading, .bs-error {
      padding: 3rem 0;
      text-align: center;
      font-size: 14px;
      color: #aaa;
      font-weight: 300;
    }

    .bs-error {
      background: #f4f3f0;
      border-radius: 8px;
      padding: 1.5rem;
      text-align: left;
      color: #666;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 11px;
      color: #ccc;
      font-weight: 300;
    }

    @media (max-width: 480px) {
      header { padding: 1.2rem 1rem; }
      main { padding: 1.5rem 1rem 3rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Baker Street</h1>
  <p>Librería independiente · San Juan</p>
</header>

<main>
  <input type="text" id="bs-search" placeholder="Buscar por título o autor..." aria-label="Buscar libros" />
  <div id="bs-filters" role="group" aria-label="Filtrar por género"></div>
  <p id="bs-count"></p>
  <div id="bs-list"><div class="bs-loading">Cargando catálogo...</div></div>
</main>

<footer>Baker Street · Catálogo actualizado desde Google Sheets</footer>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTciR-ezMp4lpUi2MFQC2IGWzz0vfdXXtSATjNn2WgS4CDIJzHpCuTAAszIHIIbvjSsOnEZ7bprL5kI/pub?gid=0&single=true&output=csv';

let allBooks = [];
let activeGenre = 'Todos';
let searchQuery = '';

function smartSplit(line) {
  const result = [];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
  const books = [];
  for (let i = 1; i < lines.length; i++) {
    const row = smartSplit(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (row[idx] || '').trim().replace(/^"|"$/g, ''); });
    const qty = parseInt(obj['cantidad'] || 0);
    if (isNaN(qty) || qty < 1) continue;
    const titulo = obj['titulo'] || obj['titulo '] || '';
    if (!titulo) continue;
    books.push({
      titulo: toTitleCase(titulo),
      autor: toTitleCase(obj['autor'] || ''),
      genero: (obj['genero'] || obj['genero '] || '').trim(),
      precio: obj['precio'] || '',
      editorial: toTitleCase(obj['editorial'] || obj['editorial '] || ''),
    });
  }
  return books;
}

function toTitleCase(str) {
  if (!str) return '';
  return str.toLowerCase().replace(/(?:^|\s|-)\S/g, c => c.toUpperCase());
}

function getGenres(books) {
  const genres = [...new Set(books.map(b => b.genero).filter(Boolean))].sort();
  return ['Todos', ...genres];
}

function renderFilters(genres) {
  const container = document.getElementById('bs-filters');
  container.innerHTML = '';
  genres.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'bs-chip' + (g === activeGenre ? ' active' : '');
    btn.textContent = g;
    btn.setAttribute('aria-pressed', g === activeGenre ? 'true' : 'false');
    btn.onclick = () => { activeGenre = g; renderFilters(genres); renderList(); };
    container.appendChild(btn);
  });
}

function renderList() {
  const q = searchQuery.toLowerCase();
  const filtered = allBooks.filter(b => {
    const matchGenre = activeGenre === 'Todos' || b.genero === activeGenre;
    const matchSearch = !q || b.titulo.toLowerCase().includes(q) || b.autor.toLowerCase().includes(q);
    return matchGenre && matchSearch;
  });

  document.getElementById('bs-count').textContent = filtered.length === 1 ? '1 libro disponible' : `${filtered.length} libros disponibles`;

  const container = document.getElementById('bs-list');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="bs-empty">No hay libros que coincidan con tu búsqueda.</div>';
    return;
  }

  const list = document.createElement('div');
  list.className = 'bs-list';

  filtered.forEach(b => {
    const item = document.createElement('div');
    item.className = 'bs-item';

    const main = document.createElement('div');

    const title = document.createElement('p');
    title.className = 'bs-item-title';
    title.textContent = b.titulo;

    const author = document.createElement('p');
    author.className = 'bs-item-author';
    author.textContent = b.autor;

    const meta = document.createElement('div');
    meta.className = 'bs-item-meta';

    if (b.genero) {
      const tag = document.createElement('span');
      tag.className = 'bs-genre-tag';
      tag.textContent = b.genero;
      meta.appendChild(tag);
    }
    if (b.editorial) {
      const ed = document.createElement('span');
      ed.className = 'bs-editorial';
      ed.textContent = b.editorial;
      meta.appendChild(ed);
    }

    main.appendChild(title);
    main.appendChild(author);
    main.appendChild(meta);

    const price = document.createElement('div');
    price.className = 'bs-item-price';
    price.textContent = b.precio;

    item.appendChild(main);
    item.appendChild(price);
    list.appendChild(item);
  });

  container.innerHTML = '';
  container.appendChild(list);
}

async function loadBooks() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error();
    const text = await res.text();
    allBooks = parseCSV(text);
    if (allBooks.length === 0) {
      document.getElementById('bs-list').innerHTML = '<div class="bs-error">La planilla se cargó pero no se encontraron libros con stock. Revisá que la columna Cantidad tenga valores numéricos mayores a 0.</div>';
      return;
    }
    renderFilters(getGenres(allBooks));
    renderList();
  } catch {
    document.getElementById('bs-list').innerHTML = '<div class="bs-error">No se pudo cargar el catálogo. Asegurate de que la planilla esté publicada como CSV en Google Sheets.</div>';
  }
}

document.getElementById('bs-search').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderList();
});

loadBooks();
</script>
</body>
</html>
